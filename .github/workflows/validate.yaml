name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      id-token: write # for codecov/codecov-action to upload coverage without a token
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      # Security and linting tools always run their newest release (operator
      # ruling 2026-11-11), so a run resolves golangci-lint's and grype's
      # latest release here; the steps below download and cache that version.
      # The cost, knowingly taken: a release that flags existing code turns
      # every open PR red at once, as golangci-lint v2.13.1 did on 2026-08-20
      # (G404 on rand.Shuffle). Then fix the code, or pin that one tool to the
      # previous version here only until the fix lands.
      - name: Resolve the newest linter and scanner releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assigned first: a failed lookup inside `echo "$(...)"` would not
          # stop the step, and an empty version would reach the cache keys.
          golangci=$(gh release view --repo golangci/golangci-lint --json tagName -q .tagName)
          grype=$(gh release view --repo anchore/grype --json tagName -q .tagName)
          echo "golangci-lint ${golangci}, grype ${grype}"
          echo "GOLANGCI_LINT_VERSION=${golangci}" >> "$GITHUB_ENV"
          echo "GRYPE_VERSION=${grype}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Init project
        run: |
          go mod tidy
          go generate ./...

      #   ____                       _ _
      #  / ___|  ___  ___ _   _ _ __(_) |_ _   _
      #  \___ \ / _ \/ __| | | | '__| | __| | | |
      #   ___) |  __/ (__| |_| | |  | | |_| |_| |
      #  |____/ \___|\___|\__,_|_|  |_|\__|\__, |
      #                                    |___/
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      #   _     _       _
      #  | |   (_)_ __ | |_
      #  | |   | | '_ \| __|
      #  | |___| | | | | |_
      #  |_____|_|_| |_|\__|
      #
      # golangci-lint is installed here, not by the action: the action
      # downloads its binary from GitHub's release downloads on every run and
      # never reuses a copy, so a GitHub outage failed this gate with nothing
      # wrong in the code (HTTP 504 on four runs, 2026-11-08). The binary is
      # cached by version. A run on main saves it and every pull request
      # restores main's copy, so only a version bump (or a cache unused for 7
      # days) downloads it, with retries and its published checksum.
      - name: Restore golangci-lint
        id: golangci-lint-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ci-tools/golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          v="${GOLANGCI_LINT_VERSION#v}"
          asset="golangci-lint-${v}-linux-amd64.tar.gz"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$tmp/$asset" "$base/$asset"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$tmp/checksums.txt" "$base/golangci-lint-${v}-checksums.txt"
          (cd "$tmp" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$asset" -C "$tmp"
          mkdir -p "$HOME/.cache/ci-tools/golangci-lint-${GOLANGCI_LINT_VERSION}"
          mv "$tmp/golangci-lint-${v}-linux-amd64/golangci-lint" "$HOME/.cache/ci-tools/golangci-lint-${GOLANGCI_LINT_VERSION}/"

      - name: Save golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ci-tools/golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Put golangci-lint on the PATH
        run: echo "$HOME/.cache/ci-tools/golangci-lint-${GOLANGCI_LINT_VERSION}" >> "$GITHUB_PATH"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Runs the golangci-lint the steps above put on the PATH.
          install-mode: none

      #   ____             _
      #  |  _ \  ___   ___| | _____ _ __
      #  | | | |/ _ \ / __| |/ / _ \ '__|
      #  | |_| | (_) | (__|   <  __/ |
      #  |____/ \___/ \___|_|\_\___|_|
      #
      - name: Build the Docker image
        run: GH_REPOSITORY="${{ github.repository }}" make VERSION=latest docker/build
      # The scan action looks for grype in the runner's tool cache before it
      # downloads it (from GitHub, the same outage), so that folder is cached
      # by version, saved by a run on main and restored by pull requests. It
      # is saved even when the scan fails: a finding says nothing about the
      # binary.
      - name: Restore grype
        id: grype-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ env.GRYPE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Run the Anchore scan action
        uses: anchore/scan-action@v7
        with:
          image: "ghcr.io/${{ github.repository }}:latest"
          output-format: json
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Save grype
        if: always() && steps.grype-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ env.GRYPE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

  #   _____         _
  #  |_   _|__  ___| |_
  #    | |/ _ \/ __| __|
  #    | |  __/\__ \ |_
  #    |_|\___||___/\__|
  #
  test:
    name: test (${{ matrix.packages.name }})
    permissions:
      contents: read
      id-token: write # for codecov/codecov-action
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        # name: job name and coverage file coverage-<name>.txt. flag: the Codecov
        # flag. upload: whether the job uploads coverage. path: the package
        # pattern to test; a measurement entry may have no path and carry
        # exclude instead, the top-level internal package names joined by "|"
        # that it leaves out of ./internal/...
        #
        # TEMPORARY MEASUREMENT LAYOUT (replaced once the job counts are
        # chosen): "internal" stays as the control and the only internal
        # coverage upload; the six internal-* entries below it time three
        # layouts of the same package set, each job alone on its runner.
        #   layout 2 = internal-engine + internal-rest-2
        #   layout 3 = internal-engine + internal-mobileapp + internal-rest-3
        #   layout 4 = internal-engine + internal-mobileapp + internal-helper
        #              + internal-rest-4
        packages:
          - name: cmd
            flag: cmd
            upload: true
            path: ./cmd/...
            timeout: 20m
          - name: internal
            flag: internal
            upload: true
            path: ./internal/...
            timeout: 10m
          - name: integration
            flag: integration
            upload: true
            path: ./tests/...
            timeout: 10m
          - name: internal-engine
            flag: internal-engine
            upload: false
            path: ./internal/engine/...
            timeout: 10m
          - name: internal-mobileapp
            flag: internal-mobileapp
            upload: false
            path: ./internal/mobileapp/...
            timeout: 10m
          - name: internal-helper
            flag: internal-helper
            upload: false
            path: ./internal/helper/...
            timeout: 10m
          - name: internal-rest-2
            flag: internal-rest-2
            upload: false
            exclude: engine
            timeout: 10m
          - name: internal-rest-3
            flag: internal-rest-3
            upload: false
            exclude: engine|mobileapp
            timeout: 10m
          - name: internal-rest-4
            flag: internal-rest-4
            upload: false
            exclude: engine|mobileapp|helper
            timeout: 10m
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Init project
        run: |
          go mod tidy
          go generate ./...

      - name: Run tests (${{ matrix.packages.name }})
        # Collect garbage less often, as make go/test does (GOGC_TEST in the
        # Makefile): the same tests, less CPU.
        env:
          GOGC: "400"
          PACKAGE_PATH: ${{ matrix.packages.path }}
          PACKAGE_EXCLUDE: ${{ matrix.packages.exclude }}
        run: |
          if [ -n "$PACKAGE_EXCLUDE" ]; then
            # The anchored pattern keeps "engine" from matching another
            # package whose name merely contains it.
            PKGS=$(go list ./internal/... | grep -v -E "^$(go list -m)/internal/(${PACKAGE_EXCLUDE})(/|$)")
          else
            PKGS="$PACKAGE_PATH"
          fi
          go test $PKGS -timeout=${{ matrix.packages.timeout }} -race -coverprofile=coverage-${{ matrix.packages.name }}.txt -covermode=atomic

      - name: Upload coverage to Codecov (${{ matrix.packages.name }})
        if: matrix.packages.upload
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-${{ matrix.packages.name }}.txt
          flags: ${{ matrix.packages.flag }}
          fail_ci_if_error: true
          use_oidc: true

  #      _ ____    _____         _
  #     | / ___|  |_   _|__  ___| |_
  #  _  | \___ \    | |/ _ \/ __| __|
  # | |_| |___) |   | |  __/\__ \ |_
  #  \___/|____/    |_|\___||___/\__|
  #
  # TEMPORARY MEASUREMENT LAYOUT (replaced once the job counts are chosen).
  # web-mobile's vitest (unit, node and render projects, so missing window.*
  # references in component render paths are caught in CI) runs as a matrix of
  # (pool, job count, job index): forks and vmThreads at 1, 2, 3 and 4 jobs,
  # plus one whole-suite threads job. "1/1" is the whole suite in one job, the
  # control. Every job names its pool on the command line, so the timing does
  # not depend on the pool vitest.config.js holds, and every job prints the
  # peak of its process tree's summed RSS, so a job that dies of memory is told
  # from one that fails a test. The job totals of one count must sum to the
  # control's. web/'s tests and the lint steps are in test-js-web-lint below,
  # so they run once, not once per job.
  test-js:
    name: test-js (${{ matrix.pool }} ${{ matrix.index }}/${{ matrix.total }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pool: forks, index: 1, total: 1 }
          - { pool: forks, index: 1, total: 2 }
          - { pool: forks, index: 2, total: 2 }
          - { pool: forks, index: 1, total: 3 }
          - { pool: forks, index: 2, total: 3 }
          - { pool: forks, index: 3, total: 3 }
          - { pool: forks, index: 1, total: 4 }
          - { pool: forks, index: 2, total: 4 }
          - { pool: forks, index: 3, total: 4 }
          - { pool: forks, index: 4, total: 4 }
          - { pool: vmThreads, index: 1, total: 1 }
          - { pool: vmThreads, index: 1, total: 2 }
          - { pool: vmThreads, index: 2, total: 2 }
          - { pool: vmThreads, index: 1, total: 3 }
          - { pool: vmThreads, index: 2, total: 3 }
          - { pool: vmThreads, index: 3, total: 3 }
          - { pool: vmThreads, index: 1, total: 4 }
          - { pool: vmThreads, index: 2, total: 4 }
          - { pool: vmThreads, index: 3, total: 4 }
          - { pool: vmThreads, index: 4, total: 4 }
          - { pool: threads, index: 1, total: 1 }
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web-mobile/package-lock.json

      - name: Install JS dependencies (web-mobile)
        run: cd web-mobile && npm ci

      - name: Run JS tests (${{ matrix.pool }} ${{ matrix.index }}/${{ matrix.total }})
        working-directory: web-mobile
        env:
          POOL: ${{ matrix.pool }}
          INDEX: ${{ matrix.index }}
          TOTAL: ${{ matrix.total }}
        run: |
          set -u
          peak_file="$(mktemp)"
          echo 0 > "$peak_file"
          npm test -- "--pool=${POOL}" "--shard=${INDEX}/${TOTAL}" &
          root=$!
          # Sample the summed RSS of the test command and everything below it
          # about every half second, and keep the peak.
          (
            peak=0
            while true; do
              kb=$(ps -eo pid=,ppid=,rss= | awk -v root="$root" '
                { parent[$1] = $2; rss[$1] = $3 }
                END {
                  keep[root] = 1
                  grew = 1
                  while (grew) {
                    grew = 0
                    for (p in parent)
                      if (!(p in keep) && (parent[p] in keep)) { keep[p] = 1; grew = 1 }
                  }
                  for (p in keep) sum += rss[p]
                  print sum + 0
                }')
              if [ "${kb:-0}" -gt "$peak" ]; then
                peak=$kb
                echo "$peak" > "$peak_file"
              fi
              sleep 0.5
            done
          ) &
          sampler=$!
          status=0
          wait "$root" || status=$?
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          peak_mib=$(( $(cat "$peak_file") / 1024 ))
          echo "Peak summed RSS (${POOL} ${INDEX}/${TOTAL}): ${peak_mib} MiB"
          echo "Peak summed RSS (${POOL} ${INDEX}/${TOTAL}): ${peak_mib} MiB" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Runs once, whatever the job counts above: web/'s tests (the CLI wrapper's
  # form validation restates rules the Go side owns, the legal shiaijo counts
  # among them, and a restatement nothing executes drifts silently) and the
  # same lint and import checks `make go/test` runs locally. Before the lint
  # step CI ran none of them, so a PR pushed without the local gate merged
  # green with lint errors.
  test-js-web-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            web-mobile/package-lock.json
            web/package-lock.json

      - name: Install JS dependencies (web-mobile)
        run: cd web-mobile && npm ci

      - name: Install JS dependencies (web)
        run: cd web && npm ci

      - name: Run web tests
        run: cd web && npm test

      - name: Lint JS and check cross-module imports
        run: make js/lint js/check-imports

  #   ____  ____  _____   _____         _
  #  |  _ \|  _ \|  ___| |_   _|__  ___| |_
  #  | |_) | | | | |_      | |/ _ \/ __| __|
  #  |  __/| |_| |  _|     | |  __/\__ \ |_
  #  |_|   |____/|_|        |_|\___||___/\__|
  #
  # Runs the PDF-dependent tests (internal/pdf/...) that skip themselves when
  # LibreOffice is absent. The regular "test" matrix above covers everything
  # else; this job only adds the soffice codepath. It runs on every PR and push
  # to main, matching the cadence of the main test matrix.
  test-pdf:
    permissions:
      contents: read
      id-token: write # for codecov/codecov-action
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Install LibreOffice headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-nogui \
            default-jre-headless \
            fonts-liberation

      - name: Init project
        run: |
          go mod tidy
          go generate ./...

      - name: Generate example workbooks (required by PDF pipeline tests)
        run: make examples

      - name: Run PDF tests (with soffice)
        run: go test ./internal/pdf/... -timeout=10m -coverprofile=coverage-pdf.txt -covermode=atomic

      - name: Upload coverage to Codecov (pdf)
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-pdf.txt
          flags: pdf
          fail_ci_if_error: true
          use_oidc: true

  #   ____                     _____         _
  #  |  _ \  ___   ___ ___    |_   _|__  ___| |_
  #  | | | |/ _ \ / __/ __|     | |/ _ \/ __| __|
  #  | |_| | (_) | (__\__ \     | |  __/\__ \ |_
  #  |____/ \___/ \___|___/     |_|\___||___/\__|
  #
  # The docs gate, the same command the PR template asks for: `make docs/build`
  # runs the public-prose check, the strict Zensical build (which fails on any
  # missing page or anchor, same-page ones included) and then
  # docs/check_links.py over the BUILT site, which also covers the links the
  # page templates emit (the landing page, the 404 page). The Makefile installs
  # the pinned toolchain into .venv-docs itself, so nothing is pip-installed
  # here. Python 3.11 is the lowest version Zensical allows.
  docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # pip's download cache, keyed on the pinned docs toolchain; the
          # Makefile still builds .venv-docs from scratch, only faster.
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Build and check docs (prose, strict build, links)
        run: make docs/build
