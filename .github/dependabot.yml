version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
      time: "05:00"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
      time: "05:00"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
      time: "05:00"
    labels:
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: saturday
      time: "05:00"
    labels:
      - "dependencies"
    groups:
      # docs/requirements.txt pins the whole Zensical tree, and zensical pins
      # zensical-ui exactly, so one package bumped alone cannot be installed.
      # One group moves the tree together.
      docs-toolchain:
        patterns:
          - "*"
