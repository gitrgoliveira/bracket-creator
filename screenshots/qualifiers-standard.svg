<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, sans-serif">
  <rect width="760" height="250" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#1a1d21">Standard: every pool sends the same top-N; the bracket is padded with byes</text>
  <text x="20" y="48" font-size="12" fill="#5c6570">16 entrants, minimum 3 per pool</text>
  <!-- five pools, one of them 4-person -->
  <g>
    <rect x="20" y="66" width="86" height="34" rx="6" fill="#eef1f4" stroke="#8a94a0"/>
    <circle cx="40" cy="83" r="4" fill="#39424c"/><circle cx="56" cy="83" r="4" fill="#39424c"/><circle cx="72" cy="83" r="4" fill="#39424c"/>
    <rect x="20" y="106" width="86" height="34" rx="6" fill="#eef1f4" stroke="#8a94a0"/>
    <circle cx="40" cy="123" r="4" fill="#39424c"/><circle cx="56" cy="123" r="4" fill="#39424c"/><circle cx="72" cy="123" r="4" fill="#39424c"/>
    <rect x="20" y="146" width="86" height="34" rx="6" fill="#eef1f4" stroke="#8a94a0"/>
    <circle cx="40" cy="163" r="4" fill="#39424c"/><circle cx="56" cy="163" r="4" fill="#39424c"/><circle cx="72" cy="163" r="4" fill="#39424c"/>
    <rect x="20" y="186" width="86" height="34" rx="6" fill="#eef1f4" stroke="#8a94a0"/>
    <circle cx="40" cy="203" r="4" fill="#39424c"/><circle cx="56" cy="203" r="4" fill="#39424c"/><circle cx="72" cy="203" r="4" fill="#39424c"/>
    <rect x="126" y="126" width="102" height="34" rx="6" fill="#eef1f4" stroke="#8a94a0"/>
    <circle cx="146" cy="143" r="4" fill="#39424c"/><circle cx="162" cy="143" r="4" fill="#39424c"/><circle cx="178" cy="143" r="4" fill="#39424c"/><circle cx="194" cy="143" r="4" fill="#39424c"/>
    <text x="126" y="176" font-size="11" fill="#5c6570">4-person pool</text>
    <text x="20" y="238" font-size="11" fill="#5c6570">5 pools</text>
  </g>
  <!-- arrows: one per pool -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1e7d46"/></marker></defs>
  <g stroke="#1e7d46" stroke-width="2" fill="none">
    <path d="M108 83 H286" marker-end="url(#a)"/>
    <path d="M108 123 H286" marker-end="url(#a)"/>
    <path d="M108 163 H286" marker-end="url(#a)"/>
    <path d="M108 203 H286" marker-end="url(#a)"/>
    <path d="M230 143 H286" marker-end="url(#a)"/>
  </g>
  <text x="238" y="70" font-size="12" fill="#1e7d46" font-weight="600">top 1 each</text>
  <!-- bracket: 8 slots, 5 filled, 3 byes -->
  <g font-size="11">
    <text x="300" y="60" font-size="12" font-weight="600" fill="#1a1d21">5 qualifiers</text>
    <rect x="300" y="66" width="120" height="20" rx="4" fill="#e2f3e9" stroke="#1e7d46"/><text x="308" y="80" fill="#1a1d21">qualifier</text>
    <rect x="300" y="88" width="120" height="20" rx="4" fill="#e2f3e9" stroke="#1e7d46"/><text x="308" y="102" fill="#1a1d21">qualifier</text>
    <rect x="300" y="110" width="120" height="20" rx="4" fill="#e2f3e9" stroke="#1e7d46"/><text x="308" y="124" fill="#1a1d21">qualifier</text>
    <rect x="300" y="132" width="120" height="20" rx="4" fill="#e2f3e9" stroke="#1e7d46"/><text x="308" y="146" fill="#1a1d21">qualifier</text>
    <rect x="300" y="154" width="120" height="20" rx="4" fill="#e2f3e9" stroke="#1e7d46"/><text x="308" y="168" fill="#1a1d21">qualifier</text>
    <rect x="300" y="176" width="120" height="20" rx="4" fill="none" stroke="#9aa4af" stroke-dasharray="4 3"/><text x="308" y="190" fill="#5c6570">bye</text>
    <rect x="300" y="198" width="120" height="20" rx="4" fill="none" stroke="#9aa4af" stroke-dasharray="4 3"/><text x="308" y="212" fill="#5c6570">bye</text>
    <rect x="300" y="220" width="120" height="20" rx="4" fill="none" stroke="#9aa4af" stroke-dasharray="4 3"/><text x="308" y="234" fill="#5c6570">bye</text>
  </g>
  <!-- bracket lines summary -->
  <g font-size="13" fill="#1a1d21">
    <text x="460" y="120" font-weight="600">8-slot knockout</text>
    <text x="460" y="142">3 of the 8 slots are byes:</text>
    <text x="460" y="162">the bracket is padded up to</text>
    <text x="460" y="182">the next power of two.</text>
  </g>
</svg>
