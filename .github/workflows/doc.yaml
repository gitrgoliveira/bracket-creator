name: deploy documentation

# The docs are versioned: each release from v2.5 has its own folder on
# gh-pages, `latest` is the newest release and the site root's default, and
# main is published as `dev`. docs/publish_docs.py decides which version a
# ref publishes (an older patch, a prerelease or a release before 2.5
# publishes nothing) and does the publishing with mike.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # Publish a release's docs by hand: a tag made before this workflow
  # published versions (v2.5.0), or a re-publish. The tag's docs are built
  # with the publish script and toolchain of the branch this is run from.
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish (vX.Y.Z), or main"
        required: true
permissions:
  contents: write
# Two quick pushes must not race for gh-pages: the second deploy waits for the
# first and then publishes on top of it. Never cancelled midway, so a publish
# either lands whole or not at all.
concurrency:
  group: docs-deploy
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      # The publish script and the pinned toolchain it runs with.
      - name: Checkout the publish tooling
        uses: actions/checkout@v7
        with:
          path: tools

      # The docs to publish: the same commit on a push, the requested ref when
      # run by hand. Its repository is where gh-pages is committed and pushed
      # from, with the credentials this checkout sets up.
      - name: Checkout the docs to publish
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: src

      # 3.11 is the lowest version Zensical allows, and the one the docs job
      # in validate.yaml builds with.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # pip's download cache, keyed on the pinned docs toolchain; the
          # Makefile still builds .venv-docs from scratch, only faster.
          cache: pip
          cache-dependency-path: |
            tools/docs/requirements.txt
            src/docs/requirements.txt

      # The same gate as CI and the PR template, on the docs being published:
      # prose check, strict Zensical build, link check over the built site.
      - name: Build and check the docs
        run: make -C src docs/build

      # Builds the version with mike, commits it to gh-pages and pushes with a
      # plain push: nothing is force-pushed, so every past publish stays in the
      # branch's history, and if gh-pages moved meanwhile the push is refused
      # rather than overwritten.
      - name: Publish the version to gh-pages
        run: |
          set -euo pipefail
          make -C tools docs/deps
          git -C src config user.name "github-actions[bot]"
          git -C src config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/.venv-docs/bin/python tools/docs/publish_docs.py "$REF" --source src --push
