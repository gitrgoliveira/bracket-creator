name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      id-token: write # for codecov/codecov-action to upload coverage without a token
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      # The linter is pinned, not "latest": a floating pin means CI's linter
      # (and its bundled gosec ruleset) can change overnight with zero commits
      # in this repo. That is exactly what broke every open PR's gate on
      # 2026-08-20 -- v2.13.1 was built the same day this stopped passing, and
      # it newly flags rand.Shuffle (G404) that v2.12.2 (the Makefile's pin,
      # used by `make go/lint` locally) did not. Keep this in lockstep with the
      # `go install` version in the Makefile's local/deps target so a local
      # green run predicts CI.
      GOLANGCI_LINT_VERSION: v2.15.0
      # The scanner the Anchore scan action runs: anchore/scan-action@v7's own
      # default, named here so the cache key below follows it. Bump it with
      # the action.
      GRYPE_VERSION: v0.110.0
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Init project
        run: |
          go mod tidy
          go generate ./...

      #   ____                       _ _
      #  / ___|  ___  ___ _   _ _ __(_) |_ _   _
      #  \___ \ / _ \/ __| | | | '__| | __| | | |
      #   ___) |  __/ (__| |_| | |  | | |_| |_| |
      #  |____/ \___|\___|\__,_|_|  |_|\__|\__, |
      #                                    |___/
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif

      #   _     _       _
      #  | |   (_)_ __ | |_
      #  | |   | | '_ \| __|
      #  | |___| | | | | |_
      #  |_____|_|_| |_|\__|
      #
      # golangci-lint is installed here, not by the action: the action
      # downloads its binary from GitHub's release downloads on every run and
      # never reuses a copy, so a GitHub outage failed this gate with nothing
      # wrong in the code (HTTP 504 on four runs, 2026-11-08). The binary is
      # cached by version. A run on main saves it and every pull request
      # restores main's copy, so only a version bump (or a cache unused for 7
      # days) downloads it, with retries and its published checksum.
      - name: Restore golangci-lint
        id: golangci-lint-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ci-tools/golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          v="${GOLANGCI_LINT_VERSION#v}"
          asset="golangci-lint-${v}-linux-amd64.tar.gz"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$tmp/$asset" "$base/$asset"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$tmp/checksums.txt" "$base/golangci-lint-${v}-checksums.txt"
          (cd "$tmp" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$asset" -C "$tmp"
          mkdir -p "$HOME/.cache/ci-tools/golangci-lint-${GOLANGCI_LINT_VERSION}"
          mv "$tmp/golangci-lint-${v}-linux-amd64/golangci-lint" "$HOME/.cache/ci-tools/golangci-lint-${GOLANGCI_LINT_VERSION}/"

      - name: Save golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ci-tools/golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Put golangci-lint on the PATH
        run: echo "$HOME/.cache/ci-tools/golangci-lint-${GOLANGCI_LINT_VERSION}" >> "$GITHUB_PATH"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Runs the golangci-lint the steps above put on the PATH.
          install-mode: none

      #   ____             _
      #  |  _ \  ___   ___| | _____ _ __
      #  | | | |/ _ \ / __| |/ / _ \ '__|
      #  | |_| | (_) | (__|   <  __/ |
      #  |____/ \___/ \___|_|\_\___|_|
      #
      - name: Build the Docker image
        run: GH_REPOSITORY="${{ github.repository }}" make VERSION=latest docker/build
      # The scan action looks for grype in the runner's tool cache before it
      # downloads it (from GitHub, the same outage), so that folder is cached
      # by version, saved by a run on main and restored by pull requests. It
      # is saved even when the scan fails: a finding says nothing about the
      # binary.
      - name: Restore grype
        id: grype-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ env.GRYPE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Run the Anchore scan action
        uses: anchore/scan-action@v7
        with:
          image: "ghcr.io/${{ github.repository }}:latest"
          output-format: json
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Save grype
        if: always() && steps.grype-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ env.GRYPE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

  #   _____         _
  #  |_   _|__  ___| |_
  #    | |/ _ \/ __| __|
  #    | |  __/\__ \ |_
  #    |_|\___||___/\__|
  #
  test:
    permissions:
      contents: read
      id-token: write # for codecov/codecov-action
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        packages:
          - name: cmd
            path: ./cmd/...
            timeout: 20m
          - name: internal
            path: ./internal/...
            timeout: 10m
          - name: integration
            path: ./tests/...
            timeout: 10m
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Init project
        run: |
          go mod tidy
          go generate ./...

      - name: Run tests (${{ matrix.packages.name }})
        run: go test ${{ matrix.packages.path }} -timeout=${{ matrix.packages.timeout }} -race -coverprofile=coverage-${{ matrix.packages.name }}.txt -covermode=atomic

      - name: Upload coverage to Codecov (${{ matrix.packages.name }})
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-${{ matrix.packages.name }}.txt
          flags: ${{ matrix.packages.name }}
          fail_ci_if_error: true
          use_oidc: true

  #      _ ____    _____         _
  #     | / ___|  |_   _|__  ___| |_
  #  _  | \___ \    | |/ _ \/ __| __|
  # | |_| |___) |   | |  __/\__ \ |_
  #  \___/|____/    |_|\___||___/\__|
  #
  # Runs both JS suites. web-mobile (unit + render projects) so missing window.*
  # references in component render paths are caught in CI; web/ because the CLI
  # wrapper's form validation restates rules the Go side owns (the legal shiaijo
  # counts among them), and a restatement nothing executes drifts silently.
  test-js:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-mobile/package-lock.json
            web/package-lock.json

      - name: Install JS dependencies (web-mobile)
        run: cd web-mobile && npm ci

      - name: Run JS tests (unit + render)
        run: cd web-mobile && npm test

      - name: Install JS dependencies (web)
        run: cd web && npm ci

      - name: Run web tests
        run: cd web && npm test

      # The same lint and import checks `make go/test` runs locally. Before
      # this step CI ran none of them, so a PR pushed without the local gate
      # merged green with lint errors.
      - name: Lint JS and check cross-module imports
        run: make js/lint js/check-imports

  #   ____  ____  _____   _____         _
  #  |  _ \|  _ \|  ___| |_   _|__  ___| |_
  #  | |_) | | | | |_      | |/ _ \/ __| __|
  #  |  __/| |_| |  _|     | |  __/\__ \ |_
  #  |_|   |____/|_|        |_|\___||___/\__|
  #
  # Runs the PDF-dependent tests (internal/pdf/...) that skip themselves when
  # LibreOffice is absent. The regular "test" matrix above covers everything
  # else; this job only adds the soffice codepath. It runs on every PR and push
  # to main, matching the cadence of the main test matrix.
  test-pdf:
    permissions:
      contents: read
      id-token: write # for codecov/codecov-action
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install LibreOffice headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-nogui \
            default-jre-headless \
            fonts-liberation

      - name: Init project
        run: |
          go mod tidy
          go generate ./...

      - name: Generate example workbooks (required by PDF pipeline tests)
        run: make examples

      - name: Run PDF tests (with soffice)
        run: go test ./internal/pdf/... -timeout=10m -coverprofile=coverage-pdf.txt -covermode=atomic

      - name: Upload coverage to Codecov (pdf)
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-pdf.txt
          flags: pdf
          fail_ci_if_error: true
          use_oidc: true

  #   ____                     _____         _
  #  |  _ \  ___   ___ ___    |_   _|__  ___| |_
  #  | | | |/ _ \ / __/ __|     | |/ _ \/ __| __|
  #  | |_| | (_) | (__\__ \     | |  __/\__ \ |_
  #  |____/ \___/ \___|___/     |_|\___||___/\__|
  #
  # Strict docs build + internal link/anchor check. The strict build fails on
  # broken cross-file links; docs/check_links.py additionally validates the
  # BUILT site, catching same-page anchors (strict only logs those) and links
  # emitted by the home/404 page templates (strict does not validate those).
  docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Check public-prose rules
        run: python3 docs/check_prose.py docs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build docs (strict)
        run: mkdocs build -f mkdocs.yaml --strict

      - name: Check internal links and anchors
        run: python3 docs/check_links.py site
