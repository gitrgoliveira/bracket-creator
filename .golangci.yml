version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - godox
    - nolintlint
  settings:
    errcheck:
      check-blank: true
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    paths:
      - web-mobile/node_modules
      - web/node_modules
      - node_modules
      - vendor
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # G204 flags a subprocess launched with any non-constant argument.
      # soffice.go holds the tree's one subprocess: LibreOffice at the path
      # LocateSoffice resolves, converting a workbook this process wrote to
      # its own temp folder. No rewrite of that call satisfies the rule. The
      # Makefile's gosec targets exclude it for this file alone too.
      - path: internal/pdf/soffice\.go
        linters:
          - gosec
        text: G204

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true