---
name: Publish Released Docker image

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.11.0)"
        required: true
        type: string
      retag_only:
        description: "Only move the floating tags (latest, vMAJOR, vMAJOR.MINOR) onto the image already published for this tag; build nothing"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# The published tag, derived once for all jobs: the release tag for a
# release/tag-push event, the supplied input for a manual dispatch.
env:
  IMAGE_TAG: >-
    ${{ github.event_name == 'release' && github.event.release.tag_name
    || github.event_name == 'workflow_dispatch' && inputs.tag
    || github.ref_name }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.image.name }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retag_only) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - name: bracket-creator
            file: Dockerfile
            tag_suffix: ""
          - name: bracket-creator-mobile
            file: Dockerfile.mobile
            tag_suffix: "-mobile"
          - name: bracket-creator-mobile-pdf
            file: Dockerfile.mobile-pdf
            tag_suffix: "-mobile-pdf"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Compute build metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M:%S %z')"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          # Derive the target platform from the runner arch
          case "${{ runner.arch }}" in
            ARM64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            *)     echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digest (${{ steps.meta.outputs.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          platforms: ${{ steps.meta.outputs.platform }}
          # Push by digest only; the merge job assembles the manifest list.
          # Keep this on ONE line: a YAML folded scalar would inject stray
          # spaces into the CSV, which buildx rejects.
          outputs: type=image,name=ghcr.io/${{ github.repository }}${{ matrix.image.tag_suffix }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ runner.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge manifests for ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    needs: build-and-push
    # A retag-only dispatch skips the build, which would otherwise skip this too.
    if: ${{ !cancelled() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: bracket-creator
            tag_suffix: ""
          - name: bracket-creator-mobile
            tag_suffix: "-mobile"
          - name: bracket-creator-mobile-pdf
            tag_suffix: "-mobile-pdf"
    steps:
      - name: Download AMD64 digest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retag_only) }}
        uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.image.name }}-X64
          path: /tmp/digests

      - name: Download ARM64 digest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retag_only) }}
        uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.image.name }}-ARM64
          path: /tmp/digests

      - name: Work out which floating tags this release moves
        run: |
          # A floating tag follows the newest stable release of what it names:
          # vMAJOR.MINOR the newest vMAJOR.MINOR.x, vMAJOR the newest vMAJOR.x.y
          # and latest the newest of all. So a patch for an older line moves only
          # its own line, and a prerelease (v2.3.0-rc1) moves none of them.
          stable=$( { git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}" 'refs/tags/v*' \
                        | sed 's|.*refs/tags/||'
                      echo "${IMAGE_TAG}"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          newest() { sort -uV | tail -n 1; }
          aliases=""
          if [[ "${IMAGE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            if [ "$(grep -E "^v${major}\.${minor}\." <<<"${stable}" | newest)" = "${IMAGE_TAG}" ]; then
              aliases="v${major}.${minor}"
            fi
            if [ "$(grep -E "^v${major}\." <<<"${stable}" | newest)" = "${IMAGE_TAG}" ]; then
              aliases="${aliases} v${major}"
            fi
            if [ "$(newest <<<"${stable}")" = "${IMAGE_TAG}" ]; then
              aliases="${aliases} latest"
            fi
          fi
          echo "ALIAS_TAGS=${aliases# }" >> "$GITHUB_ENV"
          echo "Floating tags moved by ${IMAGE_TAG}: ${aliases:-none}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.retag_only) }}
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ github.repository }}${{ matrix.image.tag_suffix }}"
          tags=(--tag "${IMAGE}:${IMAGE_TAG}")
          for alias in ${ALIAS_TAGS}; do
            tags+=(--tag "${IMAGE}:${alias}")
          done
          docker buildx imagetools create "${tags[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Move the floating tags onto the published image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retag_only }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}${{ matrix.image.tag_suffix }}"
          if [ -z "${ALIAS_TAGS}" ]; then
            echo "${IMAGE_TAG} is not the newest of any line; no floating tag moves."
            exit 0
          fi
          tags=()
          for alias in ${ALIAS_TAGS}; do
            tags+=(--tag "${IMAGE}:${alias}")
          done
          docker buildx imagetools create "${tags[@]}" "${IMAGE}:${IMAGE_TAG}"
