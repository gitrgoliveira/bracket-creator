site_name: bracket-creator
site_url: https://gitrgoliveira.github.io/bracket-creator/

# Repository
repo_name: gitrgoliveira/bracket-creator
repo_url: https://github.com/gitrgoliveira/bracket-creator

# Zensical builds the site from this file (it reads the MkDocs format, so the
# file keeps its name; docs/check_links.py reads site_url from it).
#
# check_prose.py, check_links.py and requirements.txt live under docs/ for
# proximity to what they check or build, but they are tooling, not site
# content: exclude them, and the bytecode `make docs/prose` leaves beside them,
# so none of it gets copied into the published site.
exclude_docs: |
  *.py
  __pycache__/
  requirements.txt

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/pool-draw-animation.css

# Mermaid: the theme draws every ```mermaid block itself on each page load
# (instant navigation is off, so every link loads its page in full, which the
# standalone landing page needs). It uses a global `mermaid` when one is
# loaded, so the library is pinned here rather than taken from Material's
# floating default.
extra_javascript:
  # Pinned to 11.16.0 for reproducible builds; bump the version here to
  # upgrade (check https://www.npmjs.com/package/mermaid).
  - https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js
  # The pool draw walk-through on user-guide/organisers/pool-draw.md. Mounts
  # itself on any [data-pool-draw-animation] element, so loading it site-wide
  # costs nothing on the pages that do not carry one.
  - assets/javascripts/pool-draw-animation.js

markdown_extensions:
  # md_in_html lets a raw HTML block carry Markdown (its `markdown`
  # attribute), which the `bc-fig` figures use (styled in extra.css), so
  # dropping it breaks them.
  # attr_list adds classes to images, as in `{ .bc-phone }`.
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      # Register the `mermaid` fence so the theme renders ```mermaid blocks as
      # diagrams (built-in Mermaid support) instead of plain code blocks.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  # Defining a plugins block suppresses the implicit default, so `search`
  # must be listed explicitly to keep the search box working.
  - search
  # Forward the pre-restructure user-guide URLs (published for a long time,
  # so linked externally and indexed by search engines) to their new homes.
  # Zensical has this built in: each entry becomes a small page that forwards.
  - redirects:
      redirect_maps:
        'user-guide/commands/create-playoffs.md': 'user-guide/commands/create-knockout.md'
        'user-guide/getting-started.md': 'user-guide/install/install.md'
        'user-guide/hosting.md': 'user-guide/install/hosting.md'
        'user-guide/input-format.md': 'user-guide/organisers/input-format.md'
        'user-guide/mobile-app.md': 'user-guide/organisers/run-tournament.md'
        'user-guide/naginata.md': 'user-guide/organisers/naginata.md'
        'user-guide/web-ui.md': 'user-guide/organisers/web-ui.md'

theme:
  name: material
  # Zensical's classic look: the Material for MkDocs header, tabs, sidebar and
  # TOC this site was designed on, so the move keeps every page's look.
  variant: classic
  custom_dir: overrides
  features:
    - navigation.indexes
    # navigation.sections is intentionally OFF: with it, every group renders
    # permanently expanded (~30 sidebar rows, overflowing the viewport).
    # Without it, groups are collapsible and only the active path expands.
    - navigation.tabs
    - navigation.tabs.sticky
    # One-tap copy on every code block: the docs are CLI-heavy (install +
    # command pages), so copy-paste of shell commands is the primary action.
    - content.code.copy
  favicon: assets/images/favicon.ico
  # Brand crest (kendo men + shinai + sword), white silhouette on transparent so
  # it reads on the navy header in both schemes. Derived from logo/bracket-creator.v2.jpeg.
  logo: assets/images/logo-crest-light.png
  font:
    # Atkinson Hyperlegible (Braille Institute) maximizes glyph separation
    # (l/I/1, O/0/Q); chosen for legibility in bright/noisy halls per
    # PRODUCT.md. JetBrains Mono keeps CLI examples crisp.
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  # Colors are driven entirely by assets/stylesheets/extra.css (the
  # --md-primary-fg-color / --md-accent-fg-color tokens, scoped per scheme).
  # The theme's `primary`/`accent` only accept named palettes (e.g. `indigo`),
  # not hex, so hex values here are silently ignored; they are intentionally
  # omitted so the CSS is the single source of truth.
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-3
        name: Switch to light mode

